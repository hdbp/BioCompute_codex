[project]
name = "biocompute"
version = "0.2.0"
description = "GUI-first local and distributed bioinformatics workflow manager"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.25,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.0,<3",
  "psutil>=5.9,<9",
]
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
test = ["pytest>=8", "httpx>=0.27"]
[project.scripts]
biocompute = "biocompute.app:main"
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["biocompute*"]
